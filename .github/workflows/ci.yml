name: macOS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Core contracts
        run: swift test
      - name: Build application
        run: xcodebuild -project AdaptiveReader.xcodeproj -scheme AdaptiveReader -destination 'platform=macOS' build
      - name: Configure visual test desktop
        run: swift scripts/configure-ci-display.swift
      - name: UI tests
        run: xcodebuild -project AdaptiveReader.xcodeproj -scheme AdaptiveReader -destination 'platform=macOS' -resultBundlePath TestResults.xcresult test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults.xcresult
